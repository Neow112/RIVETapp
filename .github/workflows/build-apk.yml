name: Build RIVET APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 37 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"; then
              exit 0
            fi
            echo "sdkmanager failed on attempt $attempt; retrying..."
            sleep 15
          done
          exit 1

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Verify repository structure
        shell: bash
        run: python3 scripts/verify_repo.py

      - name: Generate standard Gradle Wrapper on runner
        shell: bash
        run: |
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RIVET-debug.apk
          sha256sum dist/RIVET-debug.apk | tee dist/RIVET-debug.apk.sha256
          ls -lh dist/RIVET-debug.apk
          echo "### RIVET APK build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **RIVET-debug.apk**" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIVET-debug-apk-${{ github.run_number }}
          path: |
            dist/RIVET-debug.apk
            dist/RIVET-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
