name: Build RIVET APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # IMPORTANT: setup-android defaults to installing the legacy SDK package
      # named "tools". That package no longer exists in the current repository
      # and causes: "Warning: Failed to find package 'tools'".
      # packages: '' disables that legacy default. We install only the packages
      # RIVET actually needs in the next step.
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Show Android SDK environment
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          which sdkmanager
          sdkmanager --version

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

          install_sdk() {
            sdkmanager \
              "platform-tools" \
              "platforms;android-37" \
              "build-tools;36.0.0"
          }

          for attempt in 1 2 3; do
            if install_sdk; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK package installation failed after 3 attempts."
              echo "Available Android 37/build-tools packages:"
              sdkmanager --list | grep -E 'platforms;android-37|build-tools;36' || true
              exit 1
            fi
            echo "sdkmanager failed on attempt ${attempt}; retrying in 15 seconds..."
            sleep 15
          done

          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms/android-37"
          test -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Verify repository structure
        shell: bash
        run: python3 scripts/verify_repo.py

      - name: Generate standard Gradle Wrapper on runner
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RIVET-debug.apk
          sha256sum dist/RIVET-debug.apk | tee dist/RIVET-debug.apk.sha256
          ls -lh dist/RIVET-debug.apk
          echo "### RIVET APK build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **RIVET-debug.apk**" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIVET-debug-apk-${{ github.run_number }}
          path: |
            dist/RIVET-debug.apk
            dist/RIVET-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
