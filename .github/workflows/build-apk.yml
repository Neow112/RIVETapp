name: Build RIVET APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivet-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          echo "SDK_ROOT=${SDK_ROOT}"
          echo "sdkmanager=$(command -v sdkmanager)"
          sdkmanager --version

          # These exact package IDs were confirmed by the real GitHub runner
          # for RIVETapp on 2026-09-15. Do not change android-37.0 to android-37.
          sdkmanager --list | grep -F "platforms;android-37.0" >/dev/null
          sdkmanager --list | grep -F "build-tools;36.0.0" >/dev/null

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          test -d "${SDK_ROOT}/platforms/android-37.0"
          test -d "${SDK_ROOT}/build-tools/36.0.0"

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-37\.0|build-tools;36\.0\.0' || true

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Verify repository structure
        shell: bash
        run: python3 scripts/verify_repo.py

      - name: Generate standard Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/RIVET-debug.apk
          sha256sum dist/RIVET-debug.apk | tee dist/RIVET-debug.apk.sha256
          ls -lh dist/RIVET-debug.apk
          echo "### RIVET APK build complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **RIVET-debug.apk**" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIVET-debug-apk-${{ github.run_number }}
          path: |
            dist/RIVET-debug.apk
            dist/RIVET-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
